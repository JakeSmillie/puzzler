# Puzzler settings (shell syntax: NAME="value", no spaces around =)

# Folder to download puzzles from: the site's kindle4 folder, which contains
# index.txt (e.g. "http://puzzles.example.com/kindle4").
# The Kindle 4 can't connect to modern HTTPS sites, so use an http:// address
# (see the README). Leave empty to use only puzzles copied over USB.
# When set, puzzles not listed on the server are deleted from the Kindle.
BASE_URL="http://192.168.86.74:8000/kindle4"

# Daily wake-up time (24-hour, Kindle clock): download new puzzles and show
# today's puzzle.
SYNC_TIME="05:00"

# Sleep after this many minutes without a button press (0 = never sleep).
IDLE_MINUTES=5
