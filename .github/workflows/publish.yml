# Regenerates a rolling window of puzzles every day and publishes them to
# GitHub Pages, where the Kindle downloads them from.
# Enable it in the repo under Settings > Pages > Source: GitHub Actions.
name: Publish puzzles

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAST_DAYS: 7     # puzzles to keep for going back
  FUTURE_DAYS: 14  # puzzles ahead, so the Kindle copes with missing a few updates

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r generator/requirements.txt
      - run: python generator/tools/fetch_wordlist.py
      - name: Generate puzzles
        run: |
          python generator/generate.py --out site \
            --start "$(date -u +%F)" --past $PAST_DAYS --days $((1 + FUTURE_DAYS))
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
